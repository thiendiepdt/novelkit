[package]
name = "novelkit"
version = "1.0.2"
description = "Desktop toolkit for Chinese novel converters and translators"
authors = ["NovelKit Contributors"]
license = "GPL-3.0-only"
repository = "https://github.com/thiendiepdt/novelkit"
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "novelkit_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.6", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.10.3", features = [] }
tauri-plugin-log = "2"
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "multipart"] }
tokio = { version = "1", features = ["fs", "sync"] }
regex = "1"
url = "2"
urlencoding = "2"
scraper = "0.26.0"
futures = "0.3"
base64 = "0.22"
tauri-plugin-notification = "2"

[profile.release]
strip = true
lto = true
codegen-units = 1
panic = "abort"




